name: Android testnet APK
on:
  push:
    branches: [main]
    paths:
      - 'android-wallet/**'
      - '.github/workflows/android-testnet-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test and build
        working-directory: android-wallet
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Name installable APK
        run: cp android-wallet/app/build/outputs/apk/debug/app-debug.apk SplitChain-Testnet-debug.apk
      - name: Checksum published APK
        run: sha256sum SplitChain-Testnet-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SplitChain-Testnet-debug-apk
          path: |\n            SplitChain-Testnet-debug.apk\n            SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish stable testnet download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view testnet-wallet-latest >/dev/null 2>&1 || gh release create testnet-wallet-latest --target "${GITHUB_SHA}" --title 'SplitChain testnet Android wallet' --notes 'Experimental, valueless testnet wallet. Debug APK for public sandbox testing; never use with assets of value.' --prerelease
          gh release upload testnet-wallet-latest SplitChain-Testnet-debug.apk SHA256SUMS.txt --clobber\n          gh release edit testnet-wallet-latest --notes "Experimental valueless testnet debug APK built from commit ${GITHUB_SHA}. Debug signing keys may change between builds; back up account credentials before reinstalling."
