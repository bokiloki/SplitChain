# Overlay: Docker Compose -f compose.testnet.single-host.yaml -f compose.testnet.public.yaml
services:
  enrollment:
    build: .
    entrypoint: ["python", "-m", "splitchain.enrollment_web"]
    environment:
      TESTNET_ENROLLMENT_PASSWORD: "${TESTNET_ENROLLMENT_PASSWORD:?set a private 32+ character dashboard password}"
      TESTNET_AUTH_FILE: /operator/auth/accounts.json
      TESTNET_ENROLLMENT_QUEUE: /operator/enrollment-queue
    volumes:
      - ${AUTH_DIRECTORY:-/srv/splitchain-testnet/auth}:/operator/auth
      - ${TESTNET_OPERATOR_DIR:-/srv/splitchain-testnet}/enrollment-queue:/operator/enrollment-queue
      - ./configs/testnet-genesis.json:/etc/splitchain/testnet-genesis.json:ro
    ports: ["127.0.0.1:8091:8091"]
    read_only: true
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 96
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
  distributor:
    profiles: ["operator"]
    build: .
    entrypoint: ["python", "-m", "splitchain.distributor"]
    command: []
    volumes:
      # Mount the directory, not only accounts.json: preparation atomically replaces the file.
      - ${TESTNET_OPERATOR_DIR:-/srv/splitchain-testnet}:/operator
      - ${AUTH_DIRECTORY:-/srv/splitchain-testnet/auth}:/operator/auth
      - ./configs/testnet-genesis.json:/etc/splitchain/testnet-genesis.json:ro
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    networks: [default]
  primary:
    command: ["--host", "0.0.0.0", "--port", "8765", "--state", "/var/lib/splitchain/ledger.json", "--genesis", "/etc/splitchain/testnet-genesis.json", "--auth-secrets", "/run/splitchain/auth/accounts.json", "--node-id", "primary", "--role", "primary", "--peer", "secondary=ws://secondary:8765", "--peer", "tertiary=ws://tertiary:8765"]
    environment:
      SPLITCHAIN_PUBLIC_TRANSACTIONS: "1"
    volumes:
      - ${AUTH_DIRECTORY:-/srv/splitchain-testnet/auth}:/run/splitchain/auth:ro
  secondary:
    command: ["--host", "0.0.0.0", "--port", "8765", "--state", "/var/lib/splitchain/ledger.json", "--genesis", "/etc/splitchain/testnet-genesis.json", "--auth-secrets", "/run/splitchain/auth/accounts.json", "--node-id", "secondary", "--role", "secondary", "--peer", "primary=ws://primary:8765", "--peer", "tertiary=ws://tertiary:8765"]
    environment:
      SPLITCHAIN_PUBLIC_TRANSACTIONS: "1"
    volumes:
      - ${AUTH_DIRECTORY:-/srv/splitchain-testnet/auth}:/run/splitchain/auth:ro
  tertiary:
    command: ["--host", "0.0.0.0", "--port", "8765", "--state", "/var/lib/splitchain/ledger.json", "--genesis", "/etc/splitchain/testnet-genesis.json", "--auth-secrets", "/run/splitchain/auth/accounts.json", "--node-id", "tertiary", "--role", "tertiary", "--peer", "primary=ws://primary:8765", "--peer", "secondary=ws://secondary:8765"]
    environment:
      SPLITCHAIN_PUBLIC_TRANSACTIONS: "1"
    volumes:
      - ${AUTH_DIRECTORY:-/srv/splitchain-testnet/auth}:/run/splitchain/auth:ro
  rpc:
    build: .
    entrypoint: ["python", "-m", "splitchain.public_rpc"]
    command: []
    environment:
      PUBLIC_RPC_TRUST_PROXY_IP: "1"
    ports: ["127.0.0.1:8089:8089"]
    networks:
      default: {}
      public-proxy:
        aliases: [splitchain-rpc]
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 96
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped
  rounds:
    build: .
    entrypoint: ["python", "-m", "splitchain.round_clock"]
    command: []
    environment:
      TESTNET_AUTH_FILE: /run/splitchain/auth/accounts.json
    volumes:
      - ${AUTH_DIRECTORY:-/srv/splitchain-testnet/auth}:/run/splitchain/auth:ro
      - round-clock-data:/var/lib/splitchain
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped
  status:
    build: .
    entrypoint: ["python", "-m", "splitchain.public_status"]
    command: []
    environment:
      TESTNET_BOOTSTRAP_URL: "https://${PUBLIC_TESTNET_DOMAIN:?set PUBLIC_TESTNET_DOMAIN in .env.single-host}/splitchain/"
    ports: ["127.0.0.1:8088:8080"]
    networks:
      default: {}
      public-proxy:
        aliases: [splitchain-status]
    volumes:
      - ./configs/testnet-genesis.json:/etc/splitchain/testnet-genesis.json:ro
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped
  olc-gateway:
    build: .
    entrypoint: ["python", "-m", "splitchain.olc_gateway"]
    command: []
    environment:
      OLC_CREDENTIALS_FILE: /run/olc/credentials.json
      OLC_STATE_FILE: /var/lib/olc/state.json
    volumes:
      - ${OLC_CREDENTIALS_FILE:-/srv/splitchain-testnet/olc/credentials.json}:/run/olc/credentials.json:ro
      - olc-gateway-data:/var/lib/olc
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 96
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
  web:
    profiles: ["caddy"]
    image: caddy:2-alpine
    environment:
      TESTNET_DOMAIN: "${PUBLIC_TESTNET_DOMAIN:?set PUBLIC_TESTNET_DOMAIN in .env.single-host}"
    ports: ["80:80", "443:443"]
    volumes:
      - ./configs/Caddyfile.testnet:/etc/caddy/Caddyfile:ro
      - caddy-testnet-data:/data
      - caddy-testnet-config:/config
    depends_on: [status]
    restart: unless-stopped

volumes:
  olc-gateway-data:
  round-clock-data:
  caddy-testnet-data:
  caddy-testnet-config:

networks:
  public-proxy:
    external: true
    name: public-proxy
