# Overlay: Docker Compose -f compose.testnet.single-host.yaml -f compose.testnet.public.yaml
services:
  primary:
    command: ["--host", "0.0.0.0", "--port", "8765", "--state", "/var/lib/splitchain/ledger.json", "--genesis", "/etc/splitchain/testnet-genesis.json", "--auth-secrets", "/run/splitchain/accounts.json", "--node-id", "primary", "--role", "primary", "--peer", "secondary=ws://secondary:8765", "--peer", "tertiary=ws://tertiary:8765"]
    environment:
      SPLITCHAIN_PUBLIC_TRANSACTIONS: "1"
    volumes:
      - ${AUTH_FILE:?set AUTH_FILE to an existing private accounts.json}:/run/splitchain/accounts.json:ro
  secondary:
    command: ["--host", "0.0.0.0", "--port", "8765", "--state", "/var/lib/splitchain/ledger.json", "--genesis", "/etc/splitchain/testnet-genesis.json", "--auth-secrets", "/run/splitchain/accounts.json", "--node-id", "secondary", "--role", "secondary", "--peer", "primary=ws://primary:8765", "--peer", "tertiary=ws://tertiary:8765"]
    environment:
      SPLITCHAIN_PUBLIC_TRANSACTIONS: "1"
    volumes:
      - ${AUTH_FILE:?set AUTH_FILE to an existing private accounts.json}:/run/splitchain/accounts.json:ro
  tertiary:
    command: ["--host", "0.0.0.0", "--port", "8765", "--state", "/var/lib/splitchain/ledger.json", "--genesis", "/etc/splitchain/testnet-genesis.json", "--auth-secrets", "/run/splitchain/accounts.json", "--node-id", "tertiary", "--role", "tertiary", "--peer", "primary=ws://primary:8765", "--peer", "secondary=ws://secondary:8765"]
    environment:
      SPLITCHAIN_PUBLIC_TRANSACTIONS: "1"
    volumes:
      - ${AUTH_FILE:?set AUTH_FILE to an existing private accounts.json}:/run/splitchain/accounts.json:ro
  rpc:
    build: .
    entrypoint: ["python", "-m", "splitchain.public_rpc"]
    command: []
    ports: ["127.0.0.1:8089:8089"]
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 96
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped
  rounds:
    build: .
    entrypoint: ["python", "-m", "splitchain.round_clock"]
    command: []
    environment:
      TESTNET_AUTH_FILE: /run/splitchain/accounts.json
    volumes:
      - ${AUTH_FILE:?set AUTH_FILE to an existing private accounts.json}:/run/splitchain/accounts.json:ro
      - round-clock-data:/var/lib/splitchain
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped
  status:
    build: .
    entrypoint: ["python", "-m", "splitchain.public_status"]
    command: []
    ports: ["127.0.0.1:8088:8080"]
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped
  web:
    profiles: ["caddy"]
    image: caddy:2-alpine
    environment:
      TESTNET_DOMAIN: "${PUBLIC_TESTNET_DOMAIN:?set PUBLIC_TESTNET_DOMAIN in .env.single-host}"
    ports: ["80:80", "443:443"]
    volumes:
      - ./configs/Caddyfile.testnet:/etc/caddy/Caddyfile:ro
      - caddy-testnet-data:/data
      - caddy-testnet-config:/config
    depends_on: [status]
    restart: unless-stopped

volumes:
  round-clock-data:
  caddy-testnet-data:
  caddy-testnet-config:
