# Closed, valueless pilot on a single Docker host; not an independent public testnet.
x-node: &node
  build: .
  environment:
    SPLITCHAIN_CLUSTER_SECRET: "${SPLITCHAIN_CLUSTER_SECRET:?set a random secret in .env.single-host}"
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  mem_limit: 256m
  cpus: 0.50
  healthcheck:
    test: ["CMD", "scplit", "rpc", "status", "--url", "ws://127.0.0.1:8765"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 10s
  logging:
    options: {max-size: "10m", max-file: "3"}

services:
  primary:
    <<: *node
    command: ["--host", "0.0.0.0", "--port", "8765", "--state", "/var/lib/splitchain/ledger.json", "--genesis", "/etc/splitchain/testnet-genesis.json", "--node-id", "primary", "--role", "primary", "--peer", "secondary=ws://secondary:8765", "--peer", "tertiary=ws://tertiary:8765"]
    ports: ["127.0.0.1:8765:8765"]
    volumes:
      - primary-testnet-data:/var/lib/splitchain
      - ./configs/testnet-genesis.json:/etc/splitchain/testnet-genesis.json:ro
  secondary:
    <<: *node
    command: ["--host", "0.0.0.0", "--port", "8765", "--state", "/var/lib/splitchain/ledger.json", "--genesis", "/etc/splitchain/testnet-genesis.json", "--node-id", "secondary", "--role", "secondary", "--peer", "primary=ws://primary:8765", "--peer", "tertiary=ws://tertiary:8765"]
    ports: ["127.0.0.1:8766:8765"]
    volumes:
      - secondary-testnet-data:/var/lib/splitchain
      - ./configs/testnet-genesis.json:/etc/splitchain/testnet-genesis.json:ro
  tertiary:
    <<: *node
    command: ["--host", "0.0.0.0", "--port", "8765", "--state", "/var/lib/splitchain/ledger.json", "--genesis", "/etc/splitchain/testnet-genesis.json", "--node-id", "tertiary", "--role", "tertiary", "--peer", "primary=ws://primary:8765", "--peer", "secondary=ws://secondary:8765"]
    ports: ["127.0.0.1:8767:8765"]
    volumes:
      - tertiary-testnet-data:/var/lib/splitchain
      - ./configs/testnet-genesis.json:/etc/splitchain/testnet-genesis.json:ro

volumes:
  primary-testnet-data:
  secondary-testnet-data:
  tertiary-testnet-data:
